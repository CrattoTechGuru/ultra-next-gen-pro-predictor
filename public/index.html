<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultra Next Gen Pro Predictor</title>
<style>
body{margin:0;background:#07100d;color:#eef7f2;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1450px;margin:auto;padding:14px}.top,.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.btn{background:#0c1814;color:#eef7f2;border:1px solid #20352b;border-radius:9px;padding:9px 12px;cursor:pointer}.btn:hover,.active{border-color:#38e58d;color:#38e58d}.grid{display:grid;grid-template-columns:270px 1fr;gap:12px}.panel,.card{background:#0c1814;border:1px solid #20352b;border-radius:13px;padding:12px;margin-bottom:10px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.teams{display:flex;justify-content:space-between;gap:8px;margin:15px 0;font-weight:700;text-align:center}.pred{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.metric{background:#101f19;border-radius:8px;text-align:center;padding:8px}.metric small{display:block;color:#89a99a;margin-top:3px}.muted{color:#89a99a;font-size:12px}.green{color:#38e58d}.risk{color:#ffc857}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}input,select{box-sizing:border-box;width:100%;padding:9px;background:#07100d;color:white;border:1px solid #20352b;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #20352b;text-align:left;font-size:12px}.slip-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#101f19;border:1px solid #20352b;font-size:11px}.empty{padding:18px;text-align:center;color:#89a99a}.wide{overflow:auto}@media(max-width:850px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main class="wrap">
<header class="top"><div><h2>Ultra Next Gen Pro Predictor</h2><div class="muted">Live matches · upcoming matches · competitions · strategy slip engine</div></div><b id="status" class="green">ENGINE</b></header>
<div class="tabs"><button class="btn active" data-mode="all">All</button><button class="btn" data-mode="live">Live</button><button class="btn" data-mode="upcoming">Upcoming</button><button class="btn" data-mode="finished">Finished</button><button class="btn" id="refreshBtn">Refresh</button></div>
<div class="grid"><aside class="panel"><h3>Competitions</h3><input id="search" placeholder="Search leagues, cups, countries"><div id="comps"></div></aside>
<section>
<div class="panel"><div class="row"><h3>Strategy / Slip Generator</h3><span class="muted">No guaranteed outcome</span></div>
<div class="form"><label>Budget<input id="budget" type="number" min="0.01" step="0.01" value="1"></label><label>Target<input id="target" type="number" min="0.01" step="0.01" value="150"></label><label>Duration<select id="duration"><option value="today">Today</option><option value="24h">Next 24h</option><option value="3d">Next 3 days</option><option value="7d">Next 7 days</option></select></label><label>Risk<select id="risk"><option value="low">Lower</option><option value="balanced" selected>Balanced</option><option value="high">Higher</option></select></label></div>
<div class="slip-actions"><button class="btn active" id="createSlip">Generate Slip</button><button class="btn" id="historyBtn">Slip History</button></div><div id="slip"></div></div>
<div class="row"><h3 id="heading">All Matches</h3><span id="sync" class="muted"></span></div><div id="matches" class="cards"></div></section></div></main>
<script>
let modeValue='all',competitionQuery='';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function setStatus(t,ok=true){$('status').textContent=t;$('status').className=ok?'green':'risk'}
async function loadCompetitions(){try{const j=await api('/api/competitions?q='+encodeURIComponent($('search').value));$('comps').innerHTML='<button class="btn active" data-comp="">All competitions ('+j.count+')</button>'+j.data.map(c=>'<button class="btn compBtn" data-comp="'+esc(c.name)+'" style="width:100%;text-align:left;margin:3px 0">'+esc(c.name)+'<br><span class="muted">'+esc(c.country||'')+' · '+esc(c.type||'')+'</span></button>').join('');document.querySelectorAll('[data-comp]').forEach(b=>b.onclick=()=>{competitionQuery=b.dataset.comp;document.querySelectorAll('[data-comp]').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadMatches()})}catch(e){$('comps').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function matchCard(f){const p=f.prediction||{},q=p.probabilities||{},pick=p.market==='HOME_WIN'?f.homeTeam.name:p.market==='AWAY_WIN'?f.awayTeam.name:'Draw';return '<article class="card"><div class="row"><span class="muted">'+esc(f.competition.name)+'</span><b class="'+(f.live?'risk':'green')+'">'+(f.live?'● LIVE':'UPCOMING')+'</b></div><div class="teams"><span>'+esc(f.homeTeam.name)+'</span><span>'+(f.live?((f.score?.home??0)+' — '+(f.score?.away??0)):'VS')+'</span><span>'+esc(f.awayTeam.name)+'</span></div><div class="pred"><div class="metric"><b>'+Math.round(q.home*100)+'%</b><small>HOME</small></div><div class="metric"><b>'+Math.round(q.draw*100)+'%</b><small>DRAW</small></div><div class="metric"><b>'+Math.round(q.away*100)+'%</b><small>AWAY</small></div></div><p>Model pick: <b>'+esc(pick)+'</b> · Confidence: <b>'+esc(p.confidence)+'%</b> · <span class="risk">'+esc(p.risk)+'</span></p><div class="muted">Over 2.5 '+Math.round((p.over25||0)*100)+'% · BTTS '+Math.round((p.btts||0)*100)+'%</div></article>'}
async function loadMatches(){try{let u='/api/fixtures?mode='+modeValue+(competitionQuery?'&q='+encodeURIComponent(competitionQuery):'');const j=await api(u);$('heading').textContent=modeValue.charAt(0).toUpperCase()+modeValue.slice(1)+' Matches';$('sync').textContent='Last sync: '+(j.lastSync||'pending')+' · '+j.count+' matches';$('matches').innerHTML=j.data.length?j.data.map(matchCard).join(''):'<div class="panel empty">No matches returned by the configured providers for this filter.</div>';setStatus('ENGINE ONLINE')}catch(e){$('matches').innerHTML='<div class="panel empty">'+esc(e.message)+'</div>';setStatus('ENGINE ERROR',false)}}
function renderSlip(j){if(!j.legs.length){$('slip').innerHTML='<div class="card empty">No qualifying matches were found for this strategy and duration. Try a wider duration or a different risk level.</div>';return}const targetText=j.targetReached?'Target reached by model-implied return':'Target not reached by model-implied return';$('slip').innerHTML='<div class="card"><div class="row"><div><b>'+esc(j.id)+'</b><div class="muted">'+esc(j.source)+'</div></div><span class="badge">'+j.legs.length+' legs</span></div><p><b>'+targetText+'</b> · Required odds '+j.requiredOdds+' · Estimated odds '+j.estimatedOdds+' · Estimated return R'+j.potentialReturn+'</p><p>Estimated combined probability: <b>'+Math.round(j.estimatedCombinedProbability*100)+'%</b></p><div class="wide"><table><tr><th>Competition</th><th>Match</th><th>Selection</th><th>Probability</th><th>Risk</th></tr>'+j.legs.map(x=>'<tr><td>'+esc(x.competition)+'</td><td>'+esc(x.home)+' v '+esc(x.away)+'</td><td><b>'+esc(x.selection)+'</b></td><td>'+Math.round(x.probability*100)+'%</td><td>'+esc(x.risk)+'</td></tr>').join('')+'</table></div><div class="muted" style="margin-top:8px">Probabilities are model estimates, not bookmaker prices or guarantees.</div></div>'}
async function generateSlip(){const b=+$('budget').value,t=+$('target').value;if(!(b>0)||!(t>0)){renderSlip({legs:[]});return}try{$('createSlip').disabled=true;$('createSlip').textContent='Analysing…';const j=await api('/api/slips/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({budget:b,target:t,duration:$('duration').value,risk:$('risk').value})});renderSlip(j)}catch(e){$('slip').innerHTML='<div class="card empty">'+esc(e.message)+'</div>'}finally{$('createSlip').disabled=false;$('createSlip').textContent='Generate Slip'}}
async function showHistory(){try{const j=await api('/api/slips');$('slip').innerHTML=j.data.length?'<div class="card"><b>Slip History</b><div class="wide"><table><tr><th>ID</th><th>Created</th><th>Legs</th><th>Risk</th><th>Est. return</th></tr>'+j.data.slice(0,20).map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+new Date(x.createdAt).toLocaleString()+'</td><td>'+x.legs.length+'</td><td>'+esc(x.risk)+'</td><td>R'+esc(x.potentialReturn)+'</td></tr>').join('')+'</table></div></div>':'<div class="card empty">No generated slips yet.</div>'}catch(e){$('slip').innerHTML='<div class="card empty">'+esc(e.message)+'</div>'}}
async function refreshAll(){try{$('refreshBtn').disabled=true;await api('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await loadCompetitions();await loadMatches()}catch(e){setStatus('REFRESH ERROR',false)}finally{$('refreshBtn').disabled=false}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{modeValue=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadMatches()});$('search').oninput=loadCompetitions;$('createSlip').onclick=generateSlip;$('historyBtn').onclick=showHistory;$('refreshBtn').onclick=refreshAll;loadCompetitions();loadMatches();setInterval(loadMatches,90000);
</script></body></html>
